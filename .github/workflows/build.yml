name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write # needed for pushing to GHCR

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      digest: "${{ steps.build.outputs.digest }}"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

  sign:
    runs-on: ubuntu-latest
    needs: ["build-and-push"]
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign --key env://COSIGN_PRIVATE_KEY --yes \
            ghcr.io/${{ github.repository }}@${{ needs.build-and-push.outputs.digest }}

      - name: Generate provenance.json
        run: |
          cat > provenance.json <<'EOF'
          {
            "builder": { "id": "https://github.com/actions/runner" },
            "buildType": "https://github.com/slsa-framework/slsa-github-generator",
            "invocation": {
              "configSource": {
                "uri": "git+https://github.com/${{ github.repository }}@${{ github.ref }}",
                "digest": { "sha1": "${{ github.sha }}" }
              }
            }
          }
          EOF
          # Validate JSON
          jq -e . provenance.json > /dev/null

      - name: Attest build provenance
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign attest --key env://COSIGN_PRIVATE_KEY --yes \
            --predicate provenance.json \
            --type slsaprovenance \
            ghcr.io/${{ github.repository }}@${{ needs.build-and-push.outputs.digest }}

  emit-events:
    runs-on: ubuntu-latest
    needs: ["build-and-push", "sign"]
    steps:
      - name: Emit event to homelab
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.HOMELAB_TOKEN }}
          repository: abellucci93/homelab
          event-type: blog-image-pushed
          client-payload: |-
            {
              "image_tag": "${{ github.sha }}",
              "image_digest": "${{ needs.build-and-push.outputs.digest }}"
            }
